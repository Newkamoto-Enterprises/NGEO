    <style>
        body {
            margin: 0;
            background-color: white;
            overflow: hidden;
            font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
        }

        canvas {
            display: block;
        }

        :root {
            /* Dynamic Oyster Variables */
            --oyster-x: 50%;
            --oyster-y: 50%;
            --oyster-opacity: 0;
        }

        /* iOS 26 / QuickTime X Glassmorphic Player */
        #player {
            position: fixed;
            bottom: 60px;
            left: 50%;
            /* BIGGER PLAYER & MORE PADDING */
            width: 1100px;
            /* Double size */
            height: 110px;

            /* Enhanced Glassmorphism - iOS 26 Style */
            /* "OYSTER" Iridescence: Dynamic via CSS Variables */
            background:
                /* 1. Dynamic Oyster Flare (Follows Object) */
                radial-gradient(circle at var(--oyster-x) var(--oyster-y),
                    rgba(255, 192, 203, var(--oyster-opacity)) 0%,
                    rgba(0, 255, 255, var(--oyster-opacity)) 30%,
                    transparent 70%),
                /* 2. Base Clear Glass Tint (Very Low Opacity) */
                rgba(20, 20, 20, 0.05);

            /* BLUR: 25px frosted glass */
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);

            border-radius: 55px;

            /* Specular highlights & "Fish Eye" Edge Curvature */
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-top: 1px solid rgba(255, 255, 255, 0.5);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);

            /* Deep inset shadows to fake lens curvature/thickness */
            box-shadow:
                0 40px 90px rgba(0, 0, 0, 0.5),
                inset 0 0 0 1px rgba(255, 255, 255, 0.1),
                inset 0 1px 20px rgba(255, 255, 255, 0.2),
                inset 0 -10px 20px rgba(0, 0, 0, 0.05);

            /* LAYOUT: CSS Grid for Rigid Stability */
            display: grid;
            grid-template-columns: 180px 1fr 120px;
            /* Controls | Wave | Logo */
            grid-template-areas: "controls wave logo";
            gap: 20px;
            /* Tighter spacing */
            align-items: center;
            justify-content: start;
            /* Align grid to start */

            padding: 0 50px;
            /* Better padding */
            box-sizing: border-box;

            transform: translateX(-50%);

            color: rgba(255, 255, 255, 0.95);
            z-index: 1000;
            transition: transform 0.1s linear;
        }

        #player:hover {
            background-color: rgba(40, 40, 40, 0.1);
            transform: translateX(-50%) scale(1.02);
            box-shadow: 0 50px 100px rgba(0, 0, 0, 0.6);
        }

        .track-info-container {
            grid-area: track-info;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .controls {
            grid-area: controls;
            display: flex;
            align-items: center;
            justify-content: center;
            /* Center buttons in their cell */
            gap: 10px;
            /* Tighter gap */
        }

        .btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(255, 255, 255, 0.85);
            transition: all 0.2s ease;
        }

        .btn:active {
            transform: scale(0.9);
        }

        .btn:hover {
            opacity: 1;
            color: #fff;
            filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.4));
        }

        .play-btn {
            width: 54px;
            height: 54px;
        }

        .play-btn svg {
            width: 54px;
            height: 54px;
        }

        .skip-btn {
            width: 28px;
            height: 28px;
        }

        .skip-btn svg {
            width: 28px;
            height: 28px;
        }

        .track-info {
            grid-area: info;
            width: 100%;
            /* Fill the grid cell (300px) */
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            overflow: hidden;
            /* Removed flex-grow/margin logic */
        }

        .title {
            font-size: 20px;
            font-weight: 600;
            letter-spacing: 0.02em;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
            margin-bottom: 6px;
        }

        .artist {
            font-size: 14px;
            font-weight: 400;
            opacity: 0.7;
            letter-spacing: 0.05em;
        }

        /* WAVEFORM STYLES */
        .waveform-container {
            grid-area: wave;
            width: 100%;
            /* Fill remaining space */
            height: 60px;
            /* Removed flex-grow/margin */
            display: flex;
            align-items: center;
        }

        .logo-container {
            grid-area: logo;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100px;
            width: 100px;
        }

        /* MOBILE RESPONSIVENESS */
        @media (max-width: 768px) {
            #player {
                width: 90%;
                height: auto;
                padding: 24px;
                border-radius: 30px;
                display: grid;
                /* LOGO | CONTROLS (Row 1) */
                grid-template-columns: 80px 1fr;
                /* Row 1, Row 2 (Title), Row 3 (Wave) */
                grid-template-rows: auto auto auto;
                grid-template-areas:
                    "logo controls"
                    "info info"
                    "wave wave";
                gap: 20px;
                bottom: 30px;
                /* Raise slightly */
            }

            .logo-container {
                grid-area: logo;
                height: 60px;
                width: 60px;
                justify-self: center;
            }

            .controls {
                grid-area: controls;
                justify-content: flex-start;
                /* Next to logo */
                gap: 20px;
            }

            .track-info {
                grid-area: info;
                width: 100%;
                text-align: center;
                margin: 10px 0;
            }

            .title {
                font-size: 18px;
                /* Slightly smaller title */
                margin-bottom: 4px;
            }

            .waveform-container {
                grid-area: wave;
                height: 50px;
                /* Slightly smaller wave */
                margin: 0;
            }
        }

        .logo-container img {
            width: 100%;
            height: auto;
            opacity: 0.8;
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.2));
        }

        #waveformCanvas {
            width: 100%;
            height: 100%;
        }

        @font-face {
            font-family: 'Eurostile';
            src: url('assets/layout/Eurostile_Extended_Bold/Eurostile_Extended_Bold.ttf');
            font-weight: normal;
            font-style: normal;
        }

        /* MANIFESTO OVERLAY */
        #manifesto-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            /* background-color: #000000; REMOVED FOR DYNAMIC BG */
            z-index: 500;
            /* BEHIND PLAYER (1000) */
            display: none;
            /* Hidden by default */
            flex-direction: row;
            color: #ffffff;
            font-family: 'Eurostile', sans-serif;
            font-size: clamp(1.2rem, 4vw, 2.6em);
            /* Fluid Typography */
            line-height: 1.4;
            overflow: hidden;
            padding-bottom: 120px;
            /* Space for player */
            box-sizing: border-box;
            transition: color 0.5s ease;
            /* Smooth text color transition */
        }

        .manifesto-column {
            width: 50%;
            height: 100%;
            padding: 80px;
            /* Generous padding */
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .en-text,

            white-space: pre-wrap;
            /* Preserve formatting */
        }

        /* Character Fade Animation */
        @keyframes fadeInChar {
            0% {
                opacity: 0;
                filter: blur(2px);
            }

            100% {
                opacity: 1;
                filter: blur(0);
            }
        }

        .char-fade {
            animation: fadeInChar 0.3s ease-out forwards;
            opacity: 0;
        }

        .close-btn {
            position: absolute;
            top: 40px;
            right: 40px;
            width: 40px;
            height: 40px;
            cursor: pointer;
            z-index: 2001;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            color: #ffffff;
            user-select: none;
            transition: transform 0.2s;
        }

        .close-btn:hover {
            transform: scale(1.1);
        }

        svg {
            fill: currentColor;
        }

        @media (max-width: 768px) {
            #manifesto-overlay {
                flex-direction: column;
                overflow-y: auto;
                /* Enable scrolling */
                padding-top: 60px;
                /* Space for close btn */

                /* Space for player */
            }

            .manifesto-column {
                width: 100%;
                height: auto;
                padding: 30px;
                padding-bottom: 20px;
                justify-content: flex-start;
            }

            .close-btn {
                top: 20px;
                right: 20px;
            }
        }

        /* PLAYLIST CONTAINER */
        #playlist-container {
            position: fixed;
            top: 40px;
            left: 40px;
            bottom: 200px;
            width: 600px;
            /* Increased from 350px to give more space */
            display: flex;
            flex-direction: column;
            gap: 15px;
            z-index: 2000;
            /* High Z-index to ensure clickability */
            overflow: hidden;
            /* Hide scrollbar but allow content to move */
            pointer-events: auto;
            mask-image: linear-gradient(to bottom, black 60%, transparent 100%);
            -webkit-mask-image: linear-gradient(to bottom, black 60%, transparent 100%);
            transition: opacity 0.5s ease;
        }

        .playlist-item {
            font-family: 'Eurostile', sans-serif;
            font-size: 20px;
            /* Bigger font */
            color: rgba(255, 255, 255, 0.4);
            mix-blend-mode: difference;
            transition: all 0.5s ease;
            cursor: pointer;
            /* Make it clear it's clickable */
            cursor: pointer;
            cursor: pointer;
            white-space: nowrap;
            /* Do not wrap */
            overflow: visible;
            /* Show full text */
            line-height: 1.3;
            padding: 2px 0;
            display: block;
            flex-shrink: 0;
            padding: 2px 0;
        }

        .playlist-item.active {
            opacity: 1;
            color: rgba(255, 255, 255, 1);
            font-weight: bold;
            transform: scale(1.02);
            transform-origin: left;
        }

        .playlist-item.active {
            opacity: 1;
            color: rgba(255, 255, 255, 1);
            font-weight: bold;
            transform: scale(1.02);
            transform-origin: left;
        }

        /* Adjust Player Grid to remove Info column */
        #player {
            /* ... previous styles ... */
            grid-template-columns: 180px 1fr 120px;
            grid-template-areas: "controls wave logo";
        }

        /* Remove .track-info related styles or hide them if needed, 
           but since we removed the column from grid-template-areas, it might overlap if we don't handle it. 
           Best to assume the HTML element is gone or display:none. 
        */
        .track-info {
            display: none;
        }

        /* Ensure Canvas is behind playlist if needed, but in front of background. 
           User asked for Cassette (Canvas) at the forefront of the playlist. 
           Playlist is z-index 90. Canvas should be higher.
        */
        #three-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 95;
            /* Above Playlist (90) */
            pointer-events: auto;
            /* Allow OrbitControls */
        }

        /* Mobile Adjustments */
        @media (max-width: 768px) {
            #playlist-container {
                left: 20px;
                top: 20px;
                width: 250px;
            }

            #player {
                grid-template-columns: 80px 1fr;
                grid-template-areas:
                    "logo controls"
                    "wave wave";
            }
        }
    </style>
</head>

        let colorPalette = [];

        function extractColors(imageElement) {
            try {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                const width = 100;
                const height = 100 * (imageElement.height / imageElement.width);
                canvas.width = width;
                canvas.height = height;
                ctx.drawImage(imageElement, 0, 0, width, height);
                const imageData = ctx.getImageData(0, 0, width, height).data;
                const colorCounts = {};
                for (let i = 0; i < imageData.length; i += 4) {
                    const r = imageData[i], g = imageData[i + 1], b = imageData[i + 2];
                    if (r > 240 && g > 240 && b > 240) continue;
                    if (r < 20 && g < 20 && b < 20) continue;
                    const rQ = Math.round(r / 20) * 20, gQ = Math.round(g / 20) * 20, bQ = Math.round(b / 20) * 20;
                    const key = `${rQ},${gQ},${bQ}`;
                    if (colorCounts[key]) colorCounts[key].count++; else colorCounts[key] = { r: rQ, g: gQ, b: bQ, count: 1 };
                }
                const sortedColors = Object.values(colorCounts).sort((a, b) => b.count - a.count);
                if (sortedColors.length > 0) {
                    colorPalette = sortedColors.slice(0, 80).map(c => {
                        const originalColor = new THREE.Color(`rgb(${c.r}, ${c.g}, ${c.b})`);
                        // Desaturate by 20%
                        const hsl = { h: 0, s: 0, l: 0 };
                        originalColor.getHSL(hsl);
                        hsl.s *= 0.8;
                        const desaturatedColor = new THREE.Color().setHSL(hsl.h, hsl.s, hsl.l);
                        return desaturatedColor;
                    });
                } else {
                    colorPalette = [new THREE.Color(0x333333)];
                }
            } catch (e) { colorPalette = [new THREE.Color(0xcccccc)]; }
        }

        function createSideTexture(text, textZh) {
            const canvas = document.createElement('canvas');
            canvas.width = 256; canvas.height = 2048;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#080808'; ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = 'rgba(255,255,255,0.03)';
            for (let i = 0; i < 100; i++) ctx.fillRect(Math.random() * canvas.width, Math.random() * canvas.height, 4, 4);

            ctx.save();
            ctx.translate(canvas.width / 2, canvas.height / 2);
            ctx.rotate(Math.PI / 2);
            ctx.textAlign = 'center';

            // English text (top) - 30% larger, with margin
            const fontSizeEn = 91; // 70 * 1.3
            ctx.font = `bold ${fontSizeEn}px "PingFang SC", "Microsoft YaHei", sans-serif`;
            ctx.textBaseline = 'bottom';
            const offsetY = -10; // Closer to center, smaller gap
            ctx.fillStyle = 'rgba(0,0,0,0.8)'; ctx.fillText(text, 4, offsetY + 4);
            ctx.fillStyle = 'rgba(255,255,255,0.1)'; ctx.fillText(text, -2, offsetY - 2);
            ctx.shadowBlur = 8; ctx.shadowColor = 'rgba(0,0,0,0.5)';
            ctx.fillStyle = '#E0D8B0'; ctx.fillText(text, 0, offsetY);

            // Chinese text (bottom) - 30% larger, with margin
            const fontSizeZh = 78; // 60 * 1.3
            ctx.font = `bold ${fontSizeZh}px "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif`;
            ctx.textBaseline = 'top';
            const offsetYZh = 10; // Closer to center, smaller gap
            ctx.shadowBlur = 8;
            ctx.fillStyle = 'rgba(0,0,0,0.8)'; ctx.fillText(textZh, 4, offsetYZh + 4);
            ctx.fillStyle = 'rgba(255,255,255,0.1)'; ctx.fillText(textZh, -2, offsetYZh - 2);
            ctx.fillStyle = '#E0D8B0'; ctx.fillText(textZh, 0, offsetYZh);

            ctx.restore();
            const texture = new THREE.CanvasTexture(canvas); texture.colorSpace = THREE.SRGBColorSpace; return texture;
        }

        function animate() {

                // Silence detection: if average energy is very low, consider it silence
                const silenceThreshold = 10;
                const isSilent = avgEnergy < silenceThreshold;

                if (targetBgColor.equals(new THREE.Color(0x000000)) && !isSilent) {

                if (bgPhotoOpacity !== targetBgPhotoOpacity) {

                    transitionProgress = 0;

                if (bassEnergy > 225 && (now - lastArtChangeTime > 5000)) {

                    new THREE.TextureLoader().load(artworks[currentArtIndex], (texture) => {

                cassetteBox.rotation.x = THREE.MathUtils.lerp(startRot.x, 0, ease);
                cassetteBox.rotation.z = THREE.MathUtils.lerp(startRot.z, 0, ease);
                cassetteBox.rotation.y += 0.0005 + (0.02 * ease);
                if (progress >= 1.0) { introStage = 2; introStartTime = now; }
            } else if (introStage === 2) {
                const settleDuration = 4000;
                const progress = Math.min((now - introStartTime) / settleDuration, 1.0);
                const ease = Math.sin((progress * Math.PI) / 2);
                const s = 0.75 + (0.25 * ease); // Gently grow to final size 1.0
                cassetteBox.scale.set(s, s, s);
                cassetteBox.rotation.y += 0.02 + (0.0007 - 0.02) * ease;
                cassetteBox.rotation.x = 0; cassetteBox.rotation.z = 0; cassetteBox.position.set(0, 0, 0);
                if (progress >= 1.0) introStage = 3;
            } else {
                cassetteBox.scale.set(1.0, 1.0, 1.0);
                if (!audio.paused) {
                    cassetteBox.rotation.y += 0.002;
                    cassetteBox.position.y = Math.sin(now * 0.0005) * 0.2;
                    cassetteBox.rotation.x = Math.sin(now * 0.0005) * 0.05;
                } else {
                    cassetteBox.rotation.y += 0.0002;
                    cassetteBox.position.y *= 0.95;
                    cassetteBox.rotation.x *= 0.95;
                }
            }

            const vector = new THREE.Vector3(0, cassetteBox.position.y, 0).project(camera);
            const screenX = (vector.x * 0.5 + 0.5) * window.innerWidth;
            const screenY = (-(vector.y) * 0.5 + 0.5) * window.innerHeight;
            const rect = playerEl.getBoundingClientRect();
            const centerDistX = Math.abs(screenX - (rect.left + rect.width / 2));
            const centerDistY = Math.abs(screenY - (rect.top + rect.height / 2));
            const distThreshold = 300;
            let targetOp = 0;
            if (centerDistX < distThreshold && centerDistY < distThreshold) {
                targetOp = 1.0 - (Math.sqrt(centerDistX * centerDistX + centerDistY * centerDistY) / distThreshold);
                if (targetOp < 0) targetOp = 0;
                targetOp *= 0.5;
            }
            oysterOp += (targetOp - oysterOp) * 0.1;
            playerEl.style.setProperty('--oyster-opacity', oysterOp);
            const bx = ((screenX - rect.left) / rect.width) * 100;
            const by = ((screenY - rect.top) / rect.height) * 100;
            playerEl.style.setProperty('--oyster-x', `${bx}%`);
            playerEl.style.setProperty('--oyster-y', `${by}%`);

            if (waveformPeaks.length > 0) {
                waveCtx.clearRect(0, 0, waveformCanvas.width, waveformCanvas.height);
                const barWidth = (waveformCanvas.width / waveformPeaks.length);
                const progress = audio.currentTime / audio.duration || 0;
                for (let i = 0; i < waveformPeaks.length; i++) {
                    const peak = waveformPeaks[i];
                    const barHeight = Math.max(2, peak * waveformCanvas.height);
                    const x = i * barWidth;
                    const y = (waveformCanvas.height - barHeight) / 2;
                    const barProgress = i / waveformPeaks.length;
                    if (barProgress <= progress) {
                        waveCtx.fillStyle = 'rgba(255, 255, 255, 0.9)';
                    } else {
                        waveCtx.fillStyle = 'rgba(255, 255, 255, 0.3)';
                    }
                    waveCtx.fillRect(x, y, barWidth - 1, barHeight);
                }
            }
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', onWindowResize, false);
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
    </script>
</body>

</html>
